<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D CREATIVO | San Pedro de Jujuy</title>

    <!-- CSS de PhotoSwipe (Visor de imágenes) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.4.3/photoswipe.min.css">

    <style>
        :root { --verde: #25D366; --oscuro: #0a0a0a; --tarjeta: #161616; --texto: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--oscuro); color: var(--texto); margin: 0; line-height: 1.6; }

        nav { background: rgba(0,0,0,0.9); padding: 15px; text-align: center; position: sticky; top: 0; z-index: 1000; border-bottom: 2px solid var(--verde); }
        nav a { color: white; text-decoration: none; margin: 0 10px; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; }
        nav a:hover { color: var(--verde); }

        header { padding: 80px 20px; text-align: center; background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.9)), url('imagen13.jpeg'); background-size: cover; background-position: center; }
        header h1 { font-size: 3rem; color: var(--verde); margin: 0; text-shadow: 0 0 20px rgba(37, 211, 102, 0.5); }

        .contenedor { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .titulo-seccion { text-align: left; font-size: 2rem; margin: 40px 0 25px; color: var(--verde); border-left: 5px solid var(--verde); padding-left: 15px; }

        /* Grilla de Galería */
        .galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        
        .tarjeta { background: var(--tarjeta); border-radius: 12px; overflow: hidden; border: 1px solid #222; transition: transform 0.3s, border-color 0.3s; }
        .tarjeta:hover { transform: translateY(-5px); border-color: var(--verde); }
        
        /* Contenedor de imagen clickeable */
        .tarjeta a { display: block; overflow: hidden; cursor: pointer; position: relative; }
        
        .tarjeta img { width: 100%; height: 250px; object-fit: cover; display: block; transition: transform 0.3s; }
        .tarjeta:hover img { transform: scale(1.05); }

        .info-tarjeta { padding: 15px; text-align: center; }
        .info-tarjeta h3 { margin: 0; font-size: 1.1rem; color: #fff; }

        /* Botón Flotante de WhatsApp para Consultar en General */
        .btn-wsp-flotante { position: fixed; bottom: 20px; right: 20px; background: var(--verde); color: white; border-radius: 50px; padding: 12px 25px; text-decoration: none; font-weight: bold; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 999; }
        .btn-wsp-flotante:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <nav>
        <a href="#catalogo">Catálogo</a>
        <a href="https://wa.me/5493888000000" target="_blank">Contacto WhatsApp</a>
    </nav>

    <header>
        <h1>3D CREATIVO</h1>
        <p>Impresiones 3D y Cartelería Profesional en San Pedro de Jujuy</p>
    </header>

    <div class="contenedor" id="catalogo">
        <h2 class="titulo-seccion">Galería de Trabajos</h2>
        
        <!-- Galería vinculada a PhotoSwipe -->
        <div class="galeria" id="mi-galeria">
            
            <!-- Foto 1 -->
            <div class="tarjeta">
                <a href="imagen1.jpeg" data-pswp-width="1200" data-pswp-height="900" target="_blank">
                    <img src="imagen1.jpeg" alt="Trabajo 3D 1" />
                </a>
                <div class="info-tarjeta">
                    <h3>Trabajo #1</h3>
                </div>
            </div>

            <!-- Foto 2 -->
            <div class="tarjeta">
                <a href="imagen2.jpeg" data-pswp-width="1200" data-pswp-height="900" target="_blank">
                    <img src="imagen2.jpeg" alt="Trabajo 3D 2" />
                </a>
                <div class="info-tarjeta">
                    <h3>Trabajo #2</h3>
                </div>
            </div>

            <!-- Foto 3 -->
            <div class="tarjeta">
                <a href="imagen3.jpeg" data-pswp-width="1200" data-pswp-height="900" target="_blank">
                    <img src="imagen3.jpeg" alt="Trabajo 3D 3" />
                </a>
                <div class="info-tarjeta">
                    <h3>Trabajo #3</h3>
                </div>
            </div>

            <!-- Podés seguir agregando el resto de tus imágenes (hasta la 24) usando la misma estructura -->

        </div>
    </div>

    <!-- Botón directo de WhatsApp abajo a la derecha -->
    <a href="https://wa.me/5493888000000?text=Hola!%20Quiero%20consultar%20por%20un%20trabajo%20en%203D" class="btn-wsp-flotante" target="_blank">
        💬 Consultar por WhatsApp
    </a>

    <!-- Carga del visor JavaScript de PhotoSwipe -->
    <script type="module">
        import PhotoSwipeLightbox from 'https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.4.3/photoswipe-lightbox.esm.min.js';
        
        const lightbox = new PhotoSwipeLightbox({
            gallery: '#mi-galeria',
            children: 'a',
            pswpModule: () => import('https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.4.3/photoswipe.esm.min.js')
        });
        
        lightbox.init();
    </script>

</body>
</html>
