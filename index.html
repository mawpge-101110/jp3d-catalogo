    <!-- Visor de fotos PhotoSwipe (Zoom) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.4.3/photoswipe.min.css">

    <style>
        :root {
            --fondo: #000000;
            --tarjeta: #121214;
            --amarillo: #FFCC00;
            --verde: #25D366;
            --texto: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--fondo);
            color: var(--texto);
            margin: 0;
            padding: 0;
        }

        /* Encabezado */
        header {
            background-color: var(--fondo);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1a1a1a;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            font-style: italic;
            color: var(--amarillo);
            letter-spacing: -1px;
        }

        .btn-wsp-top {
            background-color: var(--verde);
            color: white;
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95rem;
            transition: transform 0.2s;
        }

        .btn-wsp-top:hover {
            transform: scale(1.05);
        }

        /* Grilla de trofeos */
        .contenedor {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 20px;
        }

        /* Tarjeta estilo exacto a tu imagen */
        .tarjeta {
            background-color: var(--tarjeta);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid #222;
        }

        /* Contenedor de la foto para el Zoom */
        .tarjeta a.foto-link {
            display: block;
            border-radius: 8px;
            overflow: hidden;
            cursor: zoom-in;
        }

        .tarjeta img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            border-radius: 8px;
            transition: transform 0.3s;
        }

        .tarjeta:hover img {
            transform: scale(1.03);
        }

        /* Botón CONSULTAR amarillo */
        .btn-consultar {
            background-color: var(--amarillo);
            color: #000;
            text-decoration: none;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-consultar:hover {
            background-color: #e6b800;
            transform: translateY(-2px);
        }
    </style>
</head>

    <script type="module">
