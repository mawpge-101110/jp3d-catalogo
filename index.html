<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JP_3D Impresiones | Catálogo</title>

    <style>
        :root {
            --fondo: #000000;
            --tarjeta: #121214;
            --amarillo: #FFCC00;
            --verde: #25D366;
            --texto: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--fondo);
            color: var(--texto);
            margin: 0;
            padding: 0;
        }

        /* Encabezado */
        header {
            background-color: var(--fondo);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1a1a1a;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            font-style: italic;
            color: var(--amarillo);
            letter-spacing: -1px;
        }

        .btn-wsp-top {
            background-color: var(--verde);
            color: white;
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95rem;
            transition: transform 0.2s;
        }

        .btn-wsp-top:hover {
            transform: scale(1.05);
        }

        /* Grilla de tarjetas */
        .contenedor {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 20px;
        }

        /* Tarjetas estilo exacto a JP_3D */
        .tarjeta {
            background-color: var(--tarjeta);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid #222;
        }

        .tarjeta .foto-box {
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
        }

        .tarjeta img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            border-radius: 8px;
            transition: transform 0.3s;
        }

        .tarjeta:hover img {
            transform: scale(1.04);
        }

        /* Botón CONSULTAR amarillo */
        .btn-consultar {
            background-color: var(--amarillo);
            color: #000;
            text-decoration: none;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-consultar:hover {
            background-color: #e6b800;
            transform: translateY(-2px);
        }

        /* --- VISOR EN PANTALLA COMPLETA (ZOOM) --- */
        .visor-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .visor-modal.activo {
            display: flex;
        }

        .visor-contenido {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.3);
